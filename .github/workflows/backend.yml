name: Backend checks and Hostinger deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@d52fc211a0436f8839a587b3b5b8efddab4744ea # v2
        with:
          php-version: '8.3'
          extensions: bcmath, exif, intl, pdo_sqlite, gd, zip
          coverage: none
          tools: composer:v2
      - name: Prepare Laravel directories
        run: |
          mkdir -p bootstrap/cache storage/framework/{cache/data,sessions,testing,views} storage/logs storage/app/{private,public}
          cp .env.example .env
      - run: composer validate --strict
      - run: composer install --prefer-dist --no-interaction --no-progress
      - run: composer audit --locked
      - run: php artisan test --compact

  deploy:
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && vars.HOSTINGER_DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    environment: production
    concurrency:
      group: franconia-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Deploy the tested commit over SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.HOSTINGER_SSH_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.HOSTINGER_KNOWN_HOSTS }}
          DEPLOY_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$SSH_PRIVATE_KEY" || { echo 'HOSTINGER_SSH_KEY is missing'; exit 1; }
          test -n "$SSH_KNOWN_HOSTS" || { echo 'HOSTINGER_KNOWN_HOSTS is missing'; exit 1; }
          umask 077
          key_file="$RUNNER_TEMP/franconia-deploy-key"
          hosts_file="$RUNNER_TEMP/franconia-known-hosts"
          trap 'rm -f "$key_file" "$hosts_file"' EXIT
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$key_file"
          printf '%s\n' "$SSH_KNOWN_HOSTS" > "$hosts_file"
          ssh -i "$key_file" -p 65002 \
            -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$hosts_file" -o ConnectTimeout=20 \
            u974495265@147.93.17.74 "bash -s -- $DEPLOY_SHA" < scripts/deploy-hostinger.sh
